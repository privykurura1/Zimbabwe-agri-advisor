<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#10291a" />
<title>Murimi Fara — Offline Farm Advisor</title>
<link rel="icon" type="image/png" id="favicon" href="" />

<!-- React + ReactDOM, bundled locally in vendor/ — no internet needed.
     No Babel/JSX: the app is plain JavaScript with React.createElement. -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<style>
  :root {
    --canopy: #10291a;       /* deep green from the logo, darkened */
    --canopy-2: #173a24;
    --leaf: #3f8f3a;         /* actions */
    --leaf-dark: #2f6f2c;
    --harvest: #e3a72f;      /* the advisor's accent */
    --mist: #eef1ea;         /* page */
    --surface: #ffffff;
    --rule: #dbe1d6;
    --ink: #152018;
    --ink-2: #4c5a4f;
    --ink-3: #7c887e;
    --danger: #b8432c;
    --danger-wash: #fbece8;

    --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", -apple-system, "SF Pro Display", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html { font-size: 16px; }
  html.big-text { font-size: 19px; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--mist);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--harvest); outline-offset: 2px; }

  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    flex-shrink: 0;
    background: var(--canopy);
    color: #e9efe6;
    border-bottom: 1px solid rgba(227, 167, 47, 0.35);
  }
  .topbar-inner {
    max-width: 820px;
    margin: 0 auto;
    padding: 0.7rem 1.1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .mark {
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 0.6rem;
    background: #fff;
    flex-shrink: 0;
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .mark img { width: 100%; height: 100%; object-fit: contain; }
  .mark .mono { font-weight: 700; color: var(--canopy); font-size: 0.95rem; }
  .name {
    font-family: var(--font-display);
    font-weight: 650;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    line-height: 1.1;
  }
  .name small {
    display: block;
    font-family: var(--font);
    font-weight: 400;
    font-size: 0.78rem;
    color: #a9b8ab;
    letter-spacing: 0;
    margin-top: 0.1rem;
  }
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .state {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    font-size: 0.8rem;
    color: #cfdacd;
    white-space: nowrap;
  }
  .state .led {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: #6fcf5f;
    box-shadow: 0 0 0 3px rgba(111, 207, 95, 0.18);
  }
  .state.checking .led { background: var(--harvest); box-shadow: 0 0 0 3px rgba(227, 167, 47, 0.2); }
  .state.down .led { background: #ef7a5f; box-shadow: 0 0 0 3px rgba(239, 122, 95, 0.2); }
  .size-btn {
    background: transparent;
    color: #e9efe6;
    border: 1px solid rgba(233, 239, 230, 0.28);
    border-radius: 0.5rem;
    padding: 0.3rem 0.6rem;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .size-btn:hover { border-color: var(--harvest); }
  .size-short { display: none; }

  .lanbar {
    background: var(--canopy-2);
    color: #cfdacd;
    font-size: 0.8rem;
  }
  .lanbar div { max-width: 820px; margin: 0 auto; padding: 0.4rem 1.1rem; }
  .lanbar strong { color: var(--harvest); font-weight: 600; }

  /* ---------- Conversation area ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .column {
    max-width: 820px;
    margin: 0 auto;
    padding: 1.6rem 1.1rem 1rem;
  }

  /* Welcome */
  .welcome {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 1.4rem;
    align-items: center;
    padding: 1rem 0 1.8rem;
    border-bottom: 1px solid var(--rule);
  }
  .welcome-logo {
    width: 7.5rem;
    height: 7.5rem;
    border-radius: 1.4rem;
    background: #fff;
    box-shadow: 0 1px 0 var(--rule), 0 12px 32px -18px rgba(16, 41, 26, 0.45);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .welcome-logo img { width: 100%; height: 100%; object-fit: contain; }
  .welcome h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 650;
    font-size: 1.85rem;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: var(--canopy);
    max-width: 22ch;
  }
  .welcome p {
    margin: 0.6rem 0 0;
    color: var(--ink-2);
    font-size: 1rem;
    line-height: 1.55;
    max-width: 52ch;
  }

  .covers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    margin: 1.4rem 0 0;
    padding: 0;
    list-style: none;
  }
  .covers li {
    padding: 0.2rem 1rem 0.2rem 0;
    margin-right: 1rem;
    border-right: 1px solid var(--rule);
    font-size: 0.85rem;
    line-height: 1.4;
    color: var(--ink-2);
  }
  .covers li:last-child { border-right: none; margin-right: 0; }
  .covers b {
    display: block;
    color: var(--ink);
    font-weight: 600;
    font-size: 0.92rem;
    margin-bottom: 0.15rem;
  }

  .examples-head {
    margin: 1.8rem 0 0.6rem;
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
  }
  .examples { display: grid; gap: 0.5rem; }
  .example {
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.7rem;
    padding: 0.75rem 0.9rem;
    font-size: 0.95rem;
    line-height: 1.45;
    color: var(--ink);
    cursor: pointer;
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
  }
  .example:hover { border-color: var(--leaf); }
  .example .lang {
    flex-shrink: 0;
    width: 4.6rem;
    font-size: 0.78rem;
    color: var(--ink-3);
  }

  /* Turns */
  .turn { margin-bottom: 1.8rem; }

  .ask {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    margin-bottom: 1rem;
  }
  .ask-text {
    max-width: 85%;
    background: var(--canopy);
    color: #f1f5ef;
    padding: 0.7rem 1rem;
    border-radius: 1rem 1rem 0.25rem 1rem;
    font-size: 1rem;
    line-height: 1.5;
  }
  .ask img {
    margin-top: 0.5rem;
    max-width: 13rem;
    max-height: 13rem;
    border-radius: 0.8rem;
    border: 1px solid var(--rule);
  }

  .reply {
    display: grid;
    grid-template-columns: 2.2rem 1fr;
    gap: 0.75rem;
  }
  .avatar {
    width: 2.2rem;
    height: 2.2rem;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--harvest);
    overflow: hidden;
    display: grid;
    place-items: center;
  }
  .avatar img { width: 100%; height: 100%; object-fit: contain; }
  .avatar .mono { font-size: 0.7rem; font-weight: 700; color: var(--canopy); }
  .avatar.working { animation: breathe 1.6s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(227, 167, 47, 0.55); }
    50% { box-shadow: 0 0 0 7px rgba(227, 167, 47, 0); }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 0.25rem 1rem 1rem 1rem;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--rule);
    font-size: 0.82rem;
    color: var(--ink-3);
  }
  .panel-head b { color: var(--ink); font-weight: 600; }
  .panel-body { padding: 0.9rem 1rem 0.6rem; }

  .panel.urgent { border-color: var(--danger); }
  .panel.urgent .panel-head { background: var(--danger-wash); color: var(--danger); border-bottom-color: rgba(184, 67, 44, 0.25); }
  .panel.urgent .panel-head b { color: var(--danger); }

  .alert {
    display: flex;
    gap: 0.6rem;
    align-items: flex-start;
    background: var(--danger-wash);
    color: var(--danger);
    border-radius: 0.6rem;
    padding: 0.6rem 0.75rem;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 0.9rem;
  }
  .alert svg { flex-shrink: 0; margin-top: 0.1rem; }

  .answer-heading {
    margin: 1.1rem 0 0.35rem;
    padding-left: 0.65rem;
    border-left: 3px solid var(--harvest);
    font-family: var(--font-display);
    font-weight: 650;
    font-size: 1.02rem;
    color: var(--canopy);
    line-height: 1.3;
  }
  .answer-text > .answer-heading:first-child { margin-top: 0.1rem; }

  .answer-para {
    margin: 0 0 0.6rem;
    font-size: 1rem;
    line-height: 1.65;
    max-width: 68ch;
  }
  .answer-text strong { color: var(--canopy); font-weight: 650; }

  .answer-list {
    margin: 0.2rem 0 0.7rem;
    padding: 0;
    list-style: none;
    counter-reset: step;
    max-width: 68ch;
  }
  .answer-list li {
    counter-increment: step;
    position: relative;
    padding: 0.15rem 0 0.15rem 2rem;
    margin-bottom: 0.45rem;
    font-size: 1rem;
    line-height: 1.6;
  }
  .answer-list li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 0.2rem;
    width: 1.35rem;
    height: 1.35rem;
    border-radius: 50%;
    border: 1.5px solid var(--leaf);
    color: var(--leaf-dark);
    font-size: 0.75rem;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  .grounding {
    padding: 0.65rem 1rem 0.8rem;
    border-top: 1px solid var(--rule);
    background: #f7f9f5;
    font-size: 0.82rem;
    color: var(--ink-2);
  }
  .grounding p { margin: 0 0 0.35rem; color: var(--ink-3); }
  .grounding ul { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .grounding li {
    background: #fff;
    border: 1px solid var(--rule);
    border-radius: 0.4rem;
    padding: 0.15rem 0.5rem;
    color: var(--ink);
  }

  .waiting {
    padding: 0.55rem 0;
    color: var(--ink-3);
    font-size: 0.95rem;
  }

  .error {
    margin-left: 2.95rem;
    background: var(--danger-wash);
    color: var(--danger);
    border-radius: 0.7rem;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
    line-height: 1.45;
  }

  /* ---------- Composer ---------- */
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--rule);
    background: var(--mist);
  }
  .composer-wrap {
    max-width: 820px;
    margin: 0 auto;
    padding: 0.8rem 1.1rem calc(0.8rem + env(safe-area-inset-bottom));
  }
  form {
    display: flex;
    align-items: flex-end;
    gap: 0.4rem;
    background: var(--surface);
    border: 1px solid #c9d2c4;
    border-radius: 1rem;
    padding: 0.4rem;
    box-shadow: 0 10px 28px -20px rgba(16, 41, 26, 0.5);
  }
  form:focus-within { border-color: var(--leaf); }

  textarea {
    flex: 1;
    resize: none;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.45;
    color: var(--ink);
    padding: 0.6rem 0.6rem;
    min-height: 2.75rem;
    max-height: 8rem;
  }
  textarea:focus { outline: none; }
  textarea::placeholder { color: var(--ink-3); }

  .photo-btn {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    height: 2.6rem;
    padding: 0 0.8rem;
    border-radius: 0.7rem;
    border: 1px solid var(--rule);
    background: #f4f7f2;
    color: var(--ink);
    font-size: 0.9rem;
    cursor: pointer;
  }
  .photo-btn:hover { border-color: var(--leaf); }
  .photo-btn svg { width: 1.15rem; height: 1.15rem; }

  .send-btn {
    flex-shrink: 0;
    height: 2.6rem;
    padding: 0 1.1rem;
    border-radius: 0.7rem;
    border: none;
    background: var(--leaf);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .send-btn:hover { background: var(--leaf-dark); }
  .photo-btn:disabled, .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .note {
    margin: 0.5rem 0.2rem 0;
    font-size: 0.78rem;
    line-height: 1.45;
    color: var(--ink-3);
  }

  @media (max-width: 640px) {
    .welcome { grid-template-columns: 1fr; gap: 1rem; }
    .welcome-logo { width: 5.5rem; height: 5.5rem; border-radius: 1.1rem; }
    .welcome h1 { font-size: 1.5rem; }
    .covers { grid-template-columns: 1fr 1fr; row-gap: 0.9rem; }
    .covers li:nth-child(2) { border-right: none; margin-right: 0; }
    .name small { display: none; }
    .name { white-space: nowrap; }
    .state .state-text { display: none; }
    .size-long { display: none; }
    .size-short { display: inline !important; }
    .photo-btn .label { display: none; }
    .example .lang { width: auto; }
    .example { flex-direction: column; gap: 0.2rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar.working { animation: none; }
  }
</style>
</head>

// "Needs urgent attention" is decided by the backend (URGENT_CHUNK_IDS in
// rag.py), not by searching the model's wording.

const TRUNC_MARK = "[[TRUNCATED]]";
const TRUNC_NOTE = "\n\n*(This answer was shortened. Send your question again with more detail if you need more.)*";

// Cut an unfinished answer back to its last complete sentence.
function trimIncomplete(text) {
  let t = text.replace(/\s+$/, "");
  t = t.replace(/(^|\n)[ \t]*(\d+\.|[-*•]|#{1,3})[ \t]*$/, "");
  t = t.replace(/\s+$/, "");
  if (/[.!?]["'”)\]*_]*$/.test(t)) return t;
  const re = /[.!?]["'”)\]*_]*(?=\s|$)/g;
  let cut = -1, m;
  while ((m = re.exec(t)) !== null) cut = m.index + m[0].length;
  return cut > 0 ? t.slice(0, cut) : t;
}

// **bold** -> <strong>
function renderInline(text) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => {
    if (part.startsWith("**") && part.endsWith("**")) {
      return h("strong", { key: i }, part.slice(2, -2));
    }
    return part;
  });
}

// "LIKELY CONDITION" -> "Likely condition" so headings read calmly.
function sentenceCase(text) {
  const t = text.trim().replace(/:$/, "");
  if (t !== t.toUpperCase()) return t;
  const lower = t.toLowerCase();
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}

// Model text -> headings, numbered steps and paragraphs.
function renderAnswer(text) {
  const lines = text.split("\n");
  const blocks = [];
  let currentList = null;
  const flushList = () => {
    if (currentList) { blocks.push(currentList); currentList = null; }
  };

  lines.forEach((rawLine, i) => {
    const line = rawLine.trim();
    if (!line) return;
    const headingMatch = line.match(/^#{1,3}\s*(.+)/);
    if (headingMatch) {
      flushList();
      blocks.push({ type: "heading", text: headingMatch[1].replace(/\*\*/g, ""), key: i });
      return;
    }
    const numberedMatch = line.match(/^(\d+)\.\s+(.*)/);
    if (numberedMatch) {
      if (!currentList) currentList = { type: "list", items: [], key: i };
      currentList.items.push(numberedMatch[2]);
      return;
    }
    flushList();
    blocks.push({ type: "para", text: line, key: i });
  });
  flushList();

  return blocks.map((block) => {
    if (block.type === "heading") {
      return h("div", { className: "answer-heading", key: block.key }, sentenceCase(block.text));
    }
    if (block.type === "list") {
      return h(
        "ol",
        { className: "answer-list", key: block.key },
        block.items.map((item, idx) => h("li", { key: idx }, renderInline(item)))
      );
    }
    return h("p", { className: "answer-para", key: block.key }, renderInline(block.text));
  });
}

// Pair each question with its answer.
function groupEntries(list) {
  const groups = [];
  for (let i = 0; i < list.length; i++) {
    if (list[i].type === "question") {
      const next = list[i + 1];
      if (next && next.type !== "question") { groups.push([list[i], next]); i++; }
      else groups.push([list[i]]);
    } else {
      groups.push([list[i]]);
    }
  }
  return groups;
}

function CameraIcon() {
  return h(
    "svg",
    { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true },
    h("path", { d: "M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" }),
    h("circle", { cx: 12, cy: 13, r: 3.5 })
  );
}

function AlertIcon() {
  return h(
    "svg",
    { width: 18, height: 18, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true },
    h("path", { d: "M12 3 2 20h20L12 3z" }),
    h("path", { d: "M12 10v4M12 17h.01" })
  );
}

function readBigText() {
  try { return localStorage.getItem("mf-big-text") === "1"; } catch (e) { return false; }
}

function App() {
  const [entries, setEntries] = useState([]);
  const [question, setQuestion] = useState("");
  const [loading, setLoading] = useState(false);
  const [backendOnline, setBackendOnline] = useState(null);
  const [lanAddress, setLanAddress] = useState(null);
  const [imageLoading, setImageLoading] = useState(false);
  const [logoFailed, setLogoFailed] = useState(false);
  const [bigText, setBigText] = useState(readBigText);
  const mainRef = useRef(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    document.documentElement.classList.toggle("big-text", bigText);
    try { localStorage.setItem("mf-big-text", bigText ? "1" : "0"); } catch (e) {}
  }, [bigText]);

  useEffect(() => {
    fetch(`${API_URL}/api/health`)
      .then((r) => r.json())
      .then((data) => {
        setBackendOnline(true);
        if (data.lan_address) setLanAddress(data.lan_address);
      })
      .catch(() => setBackendOnline(false));
  }, []);

  useEffect(() => {
    if (mainRef.current && entries.length > 0) mainRef.current.scrollTop = mainRef.current.scrollHeight;
  }, [entries, loading]);

  async function submitQuestion(q) {
    if (!q.trim() || loading) return;
    setQuestion("");
    setLoading(true);
    setEntries((prev) => [
      ...prev,
      { type: "question", text: q },
      { type: "answer", text: "", sources: [] },
    ]);

    try {
      const res = await fetch(`${API_URL}/api/ask/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q }),
      });
      if (!res.ok || !res.body) throw new Error("Backend returned an error");

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let sourcesParsed = false;
      let leftover = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        let chunk = decoder.decode(value, { stream: true });

        if (!sourcesParsed) {
          leftover += chunk;
          const newlineIdx = leftover.indexOf("\n");
          if (newlineIdx === -1) continue;
          const firstLine = leftover.slice(0, newlineIdx);
          chunk = leftover.slice(newlineIdx + 1);
          sourcesParsed = true;

          let sources = [];
          let urgent = false;
          if (firstLine.startsWith("META:::")) {
            try {
              const meta = JSON.parse(firstLine.replace("META:::", ""));
              sources = meta.sources || [];
              urgent = meta.urgent === true;
            } catch (e) {}
          } else if (firstLine.startsWith("SOURCES:::")) {
            try { sources = JSON.parse(firstLine.replace("SOURCES:::", "")); } catch (e) {}
          }
          setEntries((prev) => {
            const updated = [...prev];
            const last = updated[updated.length - 1];
            updated[updated.length - 1] = { ...last, sources, urgent };
            return updated;
          });
        }

        if (chunk) {
          setEntries((prev) => {
            const updated = [...prev];
            const last = updated[updated.length - 1];
            updated[updated.length - 1] = { ...last, text: last.text + chunk };
            return updated;
          });
        }
      }
      setEntries((prev) => {
        const updated = [...prev];
        const last = updated[updated.length - 1];
        if (last && typeof last.text === "string" && last.text.includes(TRUNC_MARK)) {
          const before = last.text.split(TRUNC_MARK)[0];
          updated[updated.length - 1] = { ...last, text: trimIncomplete(before) + TRUNC_NOTE };
        }
        return updated;
      });
    } catch (err) {
      setEntries((prev) => [
        ...prev.slice(0, -1),
        { type: "error", text: "Couldn't reach the advisor on this laptop. Start app.py and llama-server, then ask again." },
      ]);
    } finally {
      setLoading(false);
    }
  }

  function handleSubmit(e) {
    e.preventDefault();
    submitQuestion(question);
  }

  async function handlePhotoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    setImageLoading(true);
    const previewUrl = URL.createObjectURL(file);
    setEntries((prev) => [
      ...prev,
      { type: "question", text: "Check this crop photo", imagePreview: previewUrl },
      { type: "answer", text: "", sources: [] },
    ]);

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res = await fetch(`${API_URL}/api/classify_image`, { method: "POST", body: formData });
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      // Agentic pipeline: perception -> decision -> retrieval -> advice.
      const v = data.vision;
      const confidenceLine = `### VISION RESULT\n${v.prediction === "damaged" ? "Fall Armyworm damage detected" : "Leaf appears healthy"} — ${v.confidence}% confidence`;

      let bodyText = "";
      if (data.decision_path === "high_confidence_damaged") bodyText = `### GROUNDED DIAGNOSIS\n${data.advice}`;
      else if (data.decision_path === "high_confidence_healthy") bodyText = `### RESULT\n${data.advice}`;
      else if (data.decision_path === "medium_confidence") bodyText = `### NEEDS A CLEARER PHOTO\n${data.advice}`;
      else bodyText = `### UNCERTAIN RESULT\n${data.advice}`;

      const resultText = `${confidenceLine}\n\n${bodyText}`;

      setEntries((prev) => {
        const updated = [...prev];
        updated[updated.length - 1] = {
          ...updated[updated.length - 1],
          text: resultText,
          sources: data.sources && data.sources.length > 0
            ? data.sources
            : ["Photo analysis (offline, on-device, OpenCV 5)"],
        };
        return updated;
      });
    } catch (err) {
      setEntries((prev) => [
        ...prev.slice(0, -1),
        { type: "error", text: "Couldn't check the photo. Make sure the vision model is set up, then try again." },
      ]);
    } finally {
      setImageLoading(false);
      e.target.value = "";
    }
  }

  const openCamera = () => fileInputRef.current && fileInputRef.current.click();

  const logoImg = (cls) =>
    logoFailed
      ? h("span", { className: "mono" }, "MF")
      : h("img", { src: LOGO_SRC, alt: cls === "decor" ? "" : "Murimi Fara", onError: () => setLogoFailed(true) });

  const stateClass = backendOnline === null ? "checking" : backendOnline === false ? "down" : "";
  const stateText =
    backendOnline === null ? "Starting up" :
    backendOnline === false ? "Advisor not running" :
    "On this laptop, offline";

  const topbar = h(
    "header",
    { className: "topbar" },
    h(
      "div",
      { className: "topbar-inner" },
      h("div", { className: "mark" }, logoImg("logo")),
      h("div", { className: "name" }, "Murimi Fara", h("small", null, "Farm advisor for livestock and crops")),
      h(
        "div",
        { className: "topbar-right" },
        h("span", { className: `state ${stateClass}`, title: stateText }, h("span", { className: "led" }), h("span", { className: "state-text" }, stateText)),
        h(
          "button",
          {
            type: "button",
            className: "size-btn",
            onClick: () => setBigText((b) => !b),
            "aria-pressed": bigText,
          },
          h("span", { className: "size-long" }, bigText ? "Smaller text" : "Larger text"),
          h("span", { className: "size-short" }, bigText ? "A−" : "A+")
        )
      )
    )
  );

  const lanbar = lanAddress &&
    h("div", { className: "lanbar" }, h("div", null, "Phones on this Wi‑Fi can open ", h("strong", null, lanAddress)));

  const welcome = entries.length === 0 && h(
    React.Fragment,
    null,
    h(
      "section",
      { className: "welcome" },
      h("div", { className: "welcome-logo" }, logoImg("decor")),
      h(
        "div",
        null,
        h("h1", null, "Describe what you see on your farm."),
        h(
          "p",
          null,
          "Tell Murimi Fara about a sick animal or a damaged crop in your own words. It runs on this laptop with no internet, and every answer comes from a checked library of vet and crop guidance."
        )
      )
    ),
    h(
      "ul",
      { className: "covers" },
      h("li", null, h("b", null, "Livestock"), "Cattle, goats and poultry illness"),
      h("li", null, h("b", null, "Crops"), "Pests and damage in maize and more"),
      h("li", null, h("b", null, "Photos"), "Snap one leaf to check for armyworm"),
      h("li", null, h("b", null, "Your language"), "English, Shona or Ndebele")
    ),
    h("div", { className: "examples-head" }, "Questions farmers have asked"),
    h(
      "div",
      { className: "examples" },
      EXAMPLE_QUESTIONS.map((ex, i) =>
        h(
          "button",
          { key: i, type: "button", className: "example", onClick: () => submitQuestion(ex.text) },
          h("span", { className: "lang" }, ex.lang),
          h("span", null, ex.text)
        )
      )
    )
  );

  const turns = groupEntries(entries).map((group, gi) =>
    h(
      "div",
      { className: "turn", key: gi },
      group.map((entry, i) => {
        if (entry.type === "question") {
          return h(
            "div",
            { className: "ask", key: i },
            h("div", { className: "ask-text" }, entry.text),
            entry.imagePreview && h("img", { src: entry.imagePreview, alt: "Crop photo you sent" })
          );
        }
        if (entry.type === "error") {
          return h("div", { className: "error", key: i }, entry.text);
        }
        const waiting = !entry.text;
        const urgent = entry.urgent === true;
        return h(
          "div",
          { className: "reply", key: i },
          h("div", { className: `avatar ${waiting ? "working" : ""}` }, logoImg("decor")),
          waiting
            ? h("div", { className: "waiting" }, "Murimi Fara is checking the library…")
            : h(
                "div",
                { className: `panel ${urgent ? "urgent" : ""}` },
                h(
                  "div",
                  { className: "panel-head" },
                  h("b", null, "Murimi Fara"),
                  urgent ? "needs urgent attention" : "advice"
                ),
                h(
                  "div",
                  { className: "panel-body" },
                  urgent &&
                    h("div", { className: "alert" }, h(AlertIcon), "This could spread or kill quickly. Call your vet or extension officer today."),
                  h("div", { className: "answer-text" }, renderAnswer(entry.text))
                ),
                (entry.sources || []).length > 0 &&
                  h(
                    "div",
                    { className: "grounding" },
                    h("p", null, "Based on these guides"),
                    h("ul", null, entry.sources.map((s, j) => h("li", { key: j }, s)))
                  )
              )
        );
      })
    )
  );

  const footer = h(
    "footer",
    null,
    h(
      "div",
      { className: "composer-wrap" },
      h(
        "form",
        { onSubmit: handleSubmit },
        h("textarea", {
          rows: 1,
          value: question,
          onChange: (e) => setQuestion(e.target.value),
          placeholder: "Describe the problem…",
          "aria-label": "Your question",
          onKeyDown: (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              handleSubmit(e);
            }
          },
        }),
        h(
          "button",
          { type: "button", className: "photo-btn", disabled: imageLoading, onClick: openCamera, "aria-label": "Check a crop photo" },
          h(CameraIcon),
          h("span", { className: "label" }, imageLoading ? "Checking…" : "Photo")
        ),
        h("input", {
          ref: fileInputRef,
          type: "file",
          accept: "image/*",
          capture: "environment",
          style: { display: "none" },
          onChange: handlePhotoUpload,
        }),
        h("button", { type: "submit", className: "send-btn", disabled: loading }, loading ? "Asking…" : "Ask")
      ),
      h("p", { className: "note" }, "For photos, get close to one leaf. Questions are saved only on this laptop to help improve the advisor.")
    )
  );

  return h(
    "div",
    { className: "app" },
    topbar,
    lanbar,
    h("main", { ref: mainRef }, h("div", { className: "column" }, welcome, turns)),
    footer
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>

</body>
